<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StrideX — Product Showcase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --grey-bg:#EFEEEA;
    --ink:#1B1C16;
    --ink-dim:#6B6B5F;
    --orange:#E4622B;
    --olive:#3D4028;
    --cream:#F3F0E7;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:'Manrope', sans-serif; background:var(--grey-bg); }

  .showcase{
    padding:120px 6vw 130px;
    background:var(--grey-bg);
  }

  .showcase-head{
    max-width:640px;
    margin:0 auto 56px;
    text-align:center;
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--olive);
    color:var(--cream);
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    padding:8px 16px;
    border-radius:20px;
    margin-bottom:26px;
  }
  .eyebrow::before{ content:''; width:6px; height:6px; background:var(--orange); border-radius:50%; }

  .showcase-title{
    font-family:'Plus Jakarta Sans', sans-serif;
    font-weight:800;
    font-size:clamp(32px, 4.4vw, 50px);
    line-height:1.12;
    letter-spacing:-0.01em;
    color:var(--ink);
    text-transform:lowercase;
  }
  .showcase-title .accent{ color:var(--orange); }

  .showcase-sub{
    margin-top:18px;
    font-size:16px;
    color:var(--ink-dim);
    line-height:1.6;
  }

  /* ===== VIDEO FRAME ===== */
  .video-wrap{
    max-width:1040px;
    margin:0 auto;
    position:relative;
    border-radius:20px;
    overflow:hidden;
    background:var(--ink);
    aspect-ratio:16/9;
    box-shadow:0 30px 60px rgba(27,28,22,0.18);
  }

  .video-wrap video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .play-overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(27,28,22,0.28);
    cursor:pointer;
    transition:opacity 0.4s ease;
  }
  .play-overlay.hidden{
    opacity:0;
    pointer-events:none;
  }

  .play-btn{
    width:84px;
    height:84px;
    border-radius:50%;
    background:var(--orange);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform 0.25s ease;
  }
  .play-overlay:hover .play-btn{ transform:scale(1.06); }
  .play-btn svg{ width:26px; height:26px; margin-left:4px; }

  /* ===== LAYER CHIPS BELOW VIDEO ===== */
  .layer-chips{
    max-width:1040px;
    margin:34px auto 0;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
  }

  .chip{
    display:flex;
    align-items:center;
    gap:8px;
    background:#E4E2DA;
    padding:10px 18px;
    border-radius:20px;
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink);
    letter-spacing:0.02em;
  }
  .chip span{
    width:6px; height:6px;
    border-radius:50%;
    background:var(--orange);
  }

  @media (max-width:640px){
    .showcase{ padding:90px 6vw 90px; }
    .play-btn{ width:64px; height:64px; }
    .play-btn svg{ width:20px; height:20px; }
    .chip{ font-size:11.5px; padding:8px 14px; }
  }
</style>
</head>
<body>

<section class="showcase">
  <div class="showcase-head">
    <div class="eyebrow">See it in motion</div>
    <h2 class="showcase-title">six layers.<br>watch them <span class="accent">come together</span>.</h2>
    <p class="showcase-sub">From the knit upper down to the sole, here's exactly what's stacked inside every StrideX shoe.</p>
  </div>

  <div class="video-wrap" id="videoWrap">
    <!--
      Drop your landscape layer-explainer clip in this folder as
      "anatomy-video.mp4" and it will play here, with layers.png as the
      poster frame until someone hits play.
    -->
    <video id="showcaseVideo" poster="layers.png" playsinline controls>
      <source src="anatomy-video.mp4" type="video/mp4">
    </video>
    <div class="play-overlay" id="playOverlay">
      <div class="play-btn">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 4l14 8-14 8V4z" fill="#14150F"/></svg>
      </div>
    </div>
  </div>

  <div class="layer-chips">
    <div class="chip"><span></span>Upper</div>
    <div class="chip"><span></span>Cushion</div>
    <div class="chip"><span></span>Vibration</div>
    <div class="chip"><span></span>Isolation</div>
    <div class="chip"><span></span>Sensor &amp; Circuit</div>
    <div class="chip"><span></span>Base</div>
  </div>
</section>

<script>
  const video = document.getElementById('showcaseVideo');
  const overlay = document.getElementById('playOverlay');

  overlay.addEventListener('click', () => {
    video.play();
  });
  video.addEventListener('play', () => {
    overlay.classList.add('hidden');
  });
  video.addEventListener('pause', () => {
    overlay.classList.remove('hidden');
  });
</script>

</body>
</html>
